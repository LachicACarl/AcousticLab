name: iOS Xcode Gate 1 (EventChannel fix)

on:
  push:
    branches:
      - ci/ios-xcode-gate-bb7dc72f
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-gate-1-eventchannel-fix
  cancel-in-progress: false

jobs:
  ios-debug-no-codesign:
    name: Compile iOS EventChannel fix
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: b6d6d9c4c94455c40829edde5afdb6c0c1916b47
    steps:
      - name: Check out the immutable fix commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Select and report Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Record Flutter and Dart toolchain
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter doctor -v

      - name: Resolve Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get

      - name: Inspect iOS CocoaPods project inputs
        run: |
          set -euo pipefail
          echo "Target commit: ${TARGET_SHA}"
          echo "Checked-out commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          if [ ! -f ios/Podfile ]; then
            echo "::warning::ios/Podfile is absent at this baseline; Flutter will use the generated Swift Package integration."
          else
            echo "ios/Podfile present."
          fi
          pod --version

      - name: Build iOS debug without code signing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          flutter build ios --debug --no-codesign -v 2>&1 | tee build/ios-xcode-build.log

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-gate-1-evidence-eventchannel-fix
          path: |
            build/ios-xcode-build.log
            build/ios/iphoneos/Runner.app/**
          if-no-files-found: warn
          retention-days: 14
